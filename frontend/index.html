<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Info</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h2 id="product-name">Loading...</h2>
        <p class="desc" id="product-desc"></p>
        <div class="details">
            <span class="price" id="product-price"></span>
            <span class="weight" id="product-weight"></span>
        </div>
        <hr>
        <p class="contact">📞 <span id="product-contact"></span></p>
        <p class="website">🌐 <span id="product-website"></span></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
